name: build

on:
  push:
    branches: [main, master]
    paths:
      - 'module/**'
      - 'build/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately not android-actions/setup-android: that action shells out to
      # 'sdkmanager tools', a package Google removed from the SDK repository, so the
      # step failed on every run since the workflow was added (runs #1-#11).
      # The ubuntu runner already ships a full SDK; we only top up the packages
      # build/build.sh needs.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then echo "no Android SDK at $SDK" >&2; exit 1; fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then echo "sdkmanager not found" >&2; exit 1; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Offline tests
        run: |
          set -euo pipefail
          pwsh -NoProfile -File tools/model_install_test/run.ps1
          curl -fsSL -o "$RUNNER_TEMP/org-json.jar" \
            https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          JSON_JAR="$RUNNER_TEMP/org-json.jar" pwsh -NoProfile -File tools/layout_seed_test/run.ps1

      - name: Build (unsigned)
        run: |
          chmod +x build/build.sh
          ./build/build.sh

      - name: Show result
        run: ls -l out/apk/

      - uses: actions/upload-artifact@v4
        with:
          name: xiaobu-unlocker-unsigned
          path: out/apk/*.apk
          if-no-files-found: error
